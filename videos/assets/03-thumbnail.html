<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@700;900&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#222}
.t{width:1280px;height:720px;position:relative;overflow:hidden;background:#F7F1E3;font-family:'Noto Sans KR',sans-serif}
.t::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(31,31,31,.07) 1px,transparent 1.2px);background-size:6px 6px;pointer-events:none}
.h{font-family:'Black Han Sans','Noto Sans KR',sans-serif}
.badge{position:absolute;left:48px;top:40px;background:#1F1F1F;color:#F7F1E3;font-size:30px;padding:8px 20px;border-radius:8px;letter-spacing:1px}
.badge b{color:#F2C14E}
.base{position:absolute;left:56px;bottom:118px;width:560px;height:8px;background:#1F1F1F}
.bar{position:absolute;bottom:126px;width:150px;border:6px solid #1F1F1F;border-bottom:0}
.lbl{position:absolute;bottom:52px;width:150px;text-align:center;font-size:44px;color:#1F1F1F}
.txt{position:absolute;right:52px;top:120px;text-align:right;line-height:1.02}
.l1{font-size:118px;color:#1F1F1F}
.l2{font-size:170px;color:#F44369;-webkit-text-stroke:0}
.sub{margin-top:26px;display:inline-block;font-size:40px;font-weight:900;color:#1F1F1F;background:#F2C14E;padding:6px 18px;border:5px solid #1F1F1F}
svg.crown{position:absolute}
</style></head><body>
<div class="t" id="a">
  <div class="badge h">잘 팔리는 채널의 <b>인벤토리 #1</b></div>
  <div class="bar" style="left:70px;height:430px;background:#3a3a3a"></div>
  <div class="bar" style="left:255px;height:300px;background:#3a3a3a"></div>
  <div class="bar" style="left:440px;height:86px;background:#F44369"></div>
  <div class="base"></div>
  <div class="lbl h" style="left:70px">A</div>
  <div class="lbl h" style="left:255px">B</div>
  <div class="lbl h" style="left:440px;color:#F44369">뽀큐트</div>
  <svg class="crown" style="left:448px;top:410px" width="134" height="100" viewBox="0 0 13 10" shape-rendering="crispEdges">
    <g fill="#1F1F1F"><rect x="0" y="1" width="2" height="2"/><rect x="5.5" y="0" width="2" height="2"/><rect x="11" y="1" width="2" height="2"/><rect x="0" y="3" width="13" height="7"/></g>
    <g fill="#F2C14E"><rect x="0.5" y="1.5" width="1" height="1"/><rect x="6" y="0.5" width="1" height="1"/><rect x="11.5" y="1.5" width="1" height="1"/>
    <rect x="1" y="3" width="1" height="1"/><rect x="11" y="3" width="1" height="1"/><rect x="2" y="4" width="2" height="1"/><rect x="9" y="4" width="2" height="1"/><rect x="5" y="3" width="3" height="2"/>
    <rect x="1" y="4" width="11" height="5"/></g>
    <g fill="#F44369"><rect x="6" y="5.5" width="1" height="1.5"/></g><g fill="#2EB086"><rect x="3" y="6" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/></g>
  </svg>
  <svg style="position:absolute;left:432px;top:372px" width="170" height="40" viewBox="0 0 17 4" shape-rendering="crispEdges"><g fill="#F2C14E"><rect x="1" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="15" y="0" width="1" height="1"/><rect x="16" y="1" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/></g></svg>
  <div class="txt h"><div class="l1">조회수 꼴찌가</div><div class="l2">공구 1등?</div><div class="sub">한 달 조회수 5분의 1</div></div>
</div>
</body></html>
